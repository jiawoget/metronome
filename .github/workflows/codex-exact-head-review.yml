name: Codex test-merge review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, converted_to_draft, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  repository_dispatch:
    types: [codex_exact_head_review_recovery]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  evaluate:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
        ((github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
          github.event.comment.user.id == 199175422) ||
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    concurrency:
      group: codex-test-merge-${{ github.event.pull_request.number || github.event.issue.number || github.event.client_payload.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Evaluate current pull-request test merge
        run: node scripts/evaluate-codex-exact-head-review.mjs
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.client_payload.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
